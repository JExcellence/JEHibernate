name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Describe the problem first, then the change you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that JEHibernate makes hard or impossible today?
      placeholder: I need to ... but the repository API only lets me ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behaviour you would like. A code sketch of the call site helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried, or other designs you weighed.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Runtime (plugin / Spring Boot / standalone), database, and anything else relevant.
