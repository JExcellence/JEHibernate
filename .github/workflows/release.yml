name: Publish to Maven Central

on:
  push:
    tags:
      - "v*"   # triggers when you push a tag like v4.0.0
  workflow_dispatch: # allow manual trigger

jobs:
  publish:
    name: Publish JEHibernate to Maven Central
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 21 runs Gradle; the Java 24 toolchain is auto-provisioned via the foojay
      # resolver configured in settings.gradle.kts.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Publishes ALL modules (core, spring-boot, plugin, testing) via the
      # com.vanniktech.maven.publish plugin. Credentials and the in-memory signing key are passed
      # as Gradle project properties (ORG_GRADLE_PROJECT_*).
      #
      # Required repository secrets:
      #   OSSRH_USERNAME / OSSRH_PASSWORD  -> your Maven Central (Central Portal) user token
      #   SIGNING_KEY                      -> ASCII-armored PGP private key (in-memory)
      #   SIGNING_PASSWORD                 -> passphrase for that key
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          # Version is read from the root build (the 'version = "x"' line inside allprojects {}).
          VERSION=$(grep -m1 -E '^[[:space:]]*version[[:space:]]*=[[:space:]]*"' build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Detected version: $VERSION"
          if [[ "$VERSION" == *SNAPSHOT* ]]; then
            echo "Publishing snapshot build (all modules)…"
            ./gradlew publishToMavenCentral -x test --no-configuration-cache --stacktrace
          else
            echo "Publishing release build (all modules) and auto-releasing…"
            ./gradlew publishAndReleaseToMavenCentral -x test --no-configuration-cache --stacktrace
          fi
