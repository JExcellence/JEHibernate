[versions]
hibernate = "7.4.13.Final"
reflections = "0.10.2"
caffeine = "3.3.1"
slf4j = "2.0.20"
jetbrainsAnnotations = "26.1.0"
postgresql = "42.7.14"
mysql = "9.3.0"
mariadb = "3.5.10"
mssql = "12.8.1.jre11"
h2 = "2.5.252"
jackson = "2.22.4"
hikari = "6.3.0"
flyway = "11.20.3"
liquibase = "4.30.0"
springBoot = "3.5.16"
paper = "1.21.4-R0.1-SNAPSHOT"
junit = "5.14.4"
assertj = "3.27.7"
mockito = "5.24.0"
testcontainers = "1.21.4"

[libraries]
# ── Hibernate platform (BOM) + modules ──
hibernate-platform = { module = "org.hibernate.orm:hibernate-platform", version.ref = "hibernate" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core" }
hibernate-hikaricp = { module = "org.hibernate.orm:hibernate-hikaricp" }
hibernate-jcache = { module = "org.hibernate.orm:hibernate-jcache" }
hibernate-envers = { module = "org.hibernate.orm:hibernate-envers" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api" }
jakarta-transaction = { module = "jakarta.transaction:jakarta.transaction-api" }

# ── Core runtime deps ──
reflections = { module = "org.reflections:reflections", version.ref = "reflections" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }

# ── Migration ──
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
liquibase-core = { module = "org.liquibase:liquibase-core", version.ref = "liquibase" }

# ── Optional / compile-only ──
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }

# ── JDBC drivers ──
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
mssql = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }

# ── Spring Boot ──
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "springBoot" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor", version.ref = "springBoot" }
spring-boot-starter-jdbc = { module = "org.springframework.boot:spring-boot-starter-jdbc", version.ref = "springBoot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
spring-boot-test = { module = "org.springframework.boot:spring-boot-test", version.ref = "springBoot" }
spring-boot-test-autoconfigure = { module = "org.springframework.boot:spring-boot-test-autoconfigure", version.ref = "springBoot" }
spring-orm = { module = "org.springframework:spring-orm", version = "6.2.19" }
spring-test = { module = "org.springframework:spring-test", version = "6.2.19" }

# ── Bukkit/Paper ──
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }

# ── Test ──
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
# JUnit Platform launcher: pinned on the test runtime classpath so Gradle uses a launcher matching
# the Jupiter engine (JUnit 5.12+ ship a Platform newer than Gradle bundles, which otherwise crashes
# test teardown). 1.14.x pairs with Jupiter 5.14.x and drives any older engine on the classpath.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version = "1.14.4" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:mysql", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }
testcontainers-mssql = { module = "org.testcontainers:mssqlserver", version.ref = "testcontainers" }
